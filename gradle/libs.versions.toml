[versions]
kotlin = "2.4.20"
kordex = "1.9.2"
kordex-i18n = "1.1.1"
kord-extensions = "2.7.0-SNAPSHOT"

dotenv = "6.5.1"
kandy = "0.8.5"
logback = "1.6.3"
sqlite = "3.53.4.0"

[libraries]
dotenv = { module = "io.github.cdimascio:dotenv-kotlin", version.ref = "dotenv" }
kandy-letsPlot = { module = "org.jetbrains.kotlinx:kandy-lets-plot", version.ref = "kandy" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kordex = { id = "dev.kordex.gradle.kordex", version.ref = "kordex" }
kordex-i18n = { id = "dev.kordex.gradle.i18n", version.ref = "kordex-i18n" }
