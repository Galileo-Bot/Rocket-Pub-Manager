services:
    bot:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        mem_limit: 448m
        env_file:
            - .env
        environment:
            AYFRI_ROCKETMANAGER_DB_PATH: /app/data/rocketmanager.db
        volumes:
            - ./logs:/app/logs
            - bot_data:/app/data

volumes:
    bot_data:
