services:
    bot:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        depends_on:
            - db
        env_file:
            - .env
        volumes:
            - ./logs:/app/logs

    db:
        image: mariadb:11.8
        restart: unless-stopped
        env_file:
            - .env
        volumes:
            - mariadb_data:/var/lib/mariadb
            - ./dump.sql:/docker-entrypoint-initdb.d/init.sql
        ports:
            - '3306:3306'

volumes:
    mariadb_data:
