[versions]
kotlin = "2.1.21"
kordex = "1.7.1"
kord-extensions = "2.3.3-SNAPSHOT"
ksp = "2.1.21-2.0.1"
shadow = "8.1.1"

connector = "9.3.0"
datetime = "0.6.2"
dotenv = "6.5.1"
logback = "1.5.18"

[libraries]
connector = { module = "com.mysql:mysql-connector-j", version.ref = "connector" }
datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
dotenv = { module = "io.github.cdimascio:dotenv-kotlin", version.ref = "dotenv" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kordex = { id = "dev.kordex.gradle.kordex", version.ref = "kordex" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.github.johnrengelman.shadow", version.ref = "shadow" }
