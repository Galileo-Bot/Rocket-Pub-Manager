version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly

    labels:
      - dependencies
    assignees:
      - Ayfri

    # KordEx and Kord are pinned to snapshots, which Dependabot can't track. The KordEx Gradle plugins stay tracked.
    ignore:
      - dependency-name: 'dev.kordex:*'
      - dependency-name: 'dev.kord:*'
